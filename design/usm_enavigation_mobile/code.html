<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>USM eNavigation</title>
<!-- Tailwind CSS CDN with forms and container queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Inter & Open Sans for native academic feel -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind Custom Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            usm: {
              primary: '#438eb9',
              dark: '#2e123f',
              accent: '#e27a12',
              green: '#27ae60',
              mapBg: '#f4f6f0',
              road: '#e2e7ec',
              building: '#e3eaf3',
              buildingBorder: '#b9cde3'
            }
          },
          fontFamily: {
            sans: ['Open Sans', 'system-ui', 'sans-serif']
          }
        }
      }
    }
  </script>
<!-- BEGIN: CSS Stylesheets -->
<style data-purpose="mobile-layout">
    /* Mobile app viewport restrictions */
    html, body {
      height: 100%;
      overflow: hidden;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Open Sans', system-ui, sans-serif;
    }

    /* Scrollbar suppression for horizontal category pills */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
<style data-purpose="map-styling">
    /* Subtle pulsing effect for current GPS location pin */
    @keyframes pulse-ring {
      0% {
        transform: scale(0.95);
        opacity: 0.8;
      }
      70% {
        transform: scale(1.6);
        opacity: 0;
      }
      100% {
        transform: scale(0.95);
        opacity: 0;
      }
    }

    .pulse-dot {
      animation: pulse-ring 2.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }
  </style>
<!-- END: CSS Stylesheets -->
</head>
<body class="bg-slate-100 flex justify-center items-center h-full">
<!-- BEGIN: MobileDeviceContainer (iPhone / 390px Form Factor) -->
<div class="relative w-full max-w-[412px] h-full sm:h-[844px] bg-white overflow-hidden shadow-2xl flex flex-col sm:rounded-[36px] sm:border-[8px] sm:border-slate-800" data-purpose="device-viewport">
<!-- BEGIN: TopHeader -->
<!-- Brand header with #438eb9, USM identity, and system icons -->
<header class="relative z-30 bg-[#438eb9] text-white px-3.5 pt-3 pb-3 flex items-center justify-between shadow-md select-none shrink-0">
<!-- Left side: Hamburger menu navigation -->
<div class="flex items-center space-x-2.5">
<button aria-label="Open portal navigation" class="p-1 rounded text-white/90 hover:text-white active:bg-black/10 focus:outline-none" type="button">
<svg class="w-6 h-6 stroke-current stroke-2" fill="none" viewbox="0 0 24 24">
<path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- USM Crest / Cap & Title branding -->
<div class="flex items-center space-x-1.5">
<div class="w-7 h-7 bg-white/15 rounded flex items-center justify-center text-white backdrop-blur-xs">
<!-- Graduation Cap icon aligned with USM Student Portal -->
<svg class="w-4 h-4 fill-white" viewbox="0 0 24 24">
<path d="M12 3L1 9L12 15L21 10.09V17H23V9M5 13.18V17.18C5 19.94 8.13 22 12 22C15.87 22 19 19.94 19 17.18V13.18L12 17L5 13.18Z"></path>
</svg>
</div>
<div>
<div class="flex items-center gap-1 leading-none">
<span class="text-xs font-bold uppercase tracking-wider text-amber-300">USM</span>
<span class="text-[10px] text-white/70">|</span>
<span class="text-sm font-semibold tracking-tight text-white">eNavigation</span>
</div>
<p class="text-[9px] text-white/80 leading-tight">Kampus Induk Pulau Pinang</p>
</div>
</div>
</div>
<!-- Right side: Notifications badge & Student Avatar Shortcut -->
<div class="flex items-center space-x-2">
<!-- Campus Online message icon with alert indicator -->
<button aria-label="Portal notifications" class="relative p-1.5 rounded-full bg-white/10 active:bg-white/20 text-white" type="button">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="absolute top-1 right-1 w-2 h-2 bg-[#27ae60] rounded-full ring-2 ring-[#438eb9]"></span>
</button>
<!-- User profile circle -->
<button aria-label="Student profile" class="flex items-center focus:outline-none" type="button">
<div class="w-7 h-7 rounded-full bg-[#2e123f] border border-amber-300 text-amber-200 text-xs font-semibold flex items-center justify-center shadow-inner">
            VR
          </div>
</button>
</div>
</header>
<!-- END: TopHeader -->
<!-- BEGIN: MapViewport -->
<!-- Interactive Vector SVG Map canvas mimicking USM Main Campus -->
<main class="relative flex-1 w-full h-full overflow-hidden bg-[#eaf1e8]">
<!-- Full-Screen SVG Vector Campus Map -->
<svg class="absolute inset-0 w-full h-full object-cover" preserveaspectratio="xMidYMid slice" viewbox="0 0 450 720" xmlns="http://www.w3.org/2000/svg">
<defs>
<!-- Building Drop Shadow -->
<filter height="125%" id="buildingShadow" width="125%" x="-10%" y="-10%">
<fedropshadow dx="1" dy="2" flood-color="#0f2638" flood-opacity="0.14" stddeviation="2"></fedropshadow>
</filter>
<!-- Tree Pattern -->
<pattern height="24" id="treeCluster" patternunits="userSpaceOnUse" width="24">
<circle cx="8" cy="8" fill="#a4cf96" opacity="0.6" r="4"></circle>
<circle cx="16" cy="14" fill="#8ec37d" opacity="0.7" r="5"></circle>
</pattern>
</defs>
<!-- Campus Base Green Lawn -->
<rect fill="#edf3ea" height="100%" width="100%"></rect>
<!-- Large Green Field / Padang Kawad Area -->
<path d="M-20,160 Q70,180 150,150 T280,180 L290,290 L-10,310 Z" fill="#ddedd5"></path>
<rect fill="#cbe4c1" height="80" opacity="0.8" rx="8" width="130" x="20" y="190"></rect>
<text fill="#69965a" font-size="10" font-weight="600" text-anchor="middle" x="85" y="235">Padang Kawad USM</text>
<!-- Background Shrubberies and Trees -->
<rect fill="url(#treeCluster)" height="150" width="160" x="290" y="70"></rect>
<rect fill="url(#treeCluster)" height="180" width="140" x="0" y="520"></rect>
<!-- Paved Campus Road Network -->
<!-- Persiaran Sains / Utama loop -->
<path d="M-20,380 C110,385 160,370 210,330 C260,290 280,160 280,-20" fill="none" stroke="#dfe6ec" stroke-linecap="round" stroke-width="26"></path>
<path d="M-20,380 C110,385 160,370 210,330 C260,290 280,160 280,-20" fill="none" stroke="#fcfdfd" stroke-linecap="round" stroke-width="20"></path>
<!-- Secondary branch road: Jalan Universiti -->
<path d="M190,345 C230,420 300,450 470,440" fill="none" stroke="#dfe6ec" stroke-linecap="round" stroke-width="20"></path>
<path d="M190,345 C230,420 300,450 470,440" fill="none" stroke="#fcfdfd" stroke-linecap="round" stroke-width="16"></path>
<!-- Upper Campus loop road -->
<path d="M280,140 C340,130 380,160 460,150" fill="none" stroke="#dfe6ec" stroke-width="18"></path>
<path d="M280,140 C340,130 380,160 460,150" fill="none" stroke="#fcfdfd" stroke-width="14"></path>
<!-- Pedestrian Walkway / Covered Link Paths -->
<path d="M130,375 L130,490 L260,490" fill="none" stroke="#d5b99a" stroke-dasharray="4,3" stroke-width="3"></path>
<path d="M280,240 L340,240 L340,340" fill="none" stroke="#d5b99a" stroke-dasharray="4,3" stroke-width="3"></path>
<!-- BUILDING 1: DTSP (Dewan Tuanku Syed Putra) -->
<g filter="url(#buildingShadow)">
<polygon fill="#e9eef5" points="40,80 140,80 160,130 20,130" stroke="#b6c8dc" stroke-width="1.5"></polygon>
<!-- Roof line details -->
<line stroke="#cbd7e6" stroke-width="1" x1="45" x2="135" y1="95" y2="95"></line>
<text fill="#3b5875" font-size="9" font-weight="700" text-anchor="middle" x="90" y="106">Dewan Tuanku</text>
<text fill="#52708f" font-size="8.5" font-weight="600" text-anchor="middle" x="90" y="118">Syed Putra (DTSP)</text>
</g>
<!-- BUILDING 2: Perpustakaan Hamzah Sendut (Main Library) -->
<g filter="url(#buildingShadow)">
<rect fill="#f8fafc" height="75" rx="4" stroke="#b2c6dc" stroke-width="1.5" width="105" x="305" y="190"></rect>
<rect fill="#e4ebf5" height="24" rx="2" width="30" x="312" y="196"></rect>
<text fill="#2d4a68" font-size="8.5" font-weight="700" text-anchor="middle" x="357" y="222">Perpustakaan</text>
<text fill="#546e8a" font-size="8" font-weight="600" text-anchor="middle" x="357" y="233">Hamzah Sendut</text>
<rect fill="#e4ebf5" height="18" rx="2" width="22" x="382" y="240"></rect>
</g>
<!-- BUILDING 3: Kompleks Dewan Kuliah (DK A-W) -->
<g filter="url(#buildingShadow)">
<!-- Segmented lecture theatre shapes -->
<path d="M50,420 L120,410 L145,465 L75,475 Z" fill="#edf2f7" stroke="#b2c6dc" stroke-width="1.5"></path>
<text fill="#334e68" font-size="9" font-weight="700" text-anchor="middle" x="98" y="442">DKG / DK V</text>
<text fill="#627d98" font-size="7.5" font-weight="500" text-anchor="middle" x="98" y="453">Kompleks Kuliah</text>
</g>
<!-- BUILDING 4: Pusat Pelajar & Kafe Siswa -->
<g filter="url(#buildingShadow)">
<polygon fill="#f4f7fb" points="210,480 310,480 300,535 200,535" stroke="#b7c9dd" stroke-width="1.5"></polygon>
<circle cx="290" cy="505" fill="#e27a12" opacity="0.8" r="4"></circle>
<text fill="#2b4764" font-size="8.5" font-weight="700" text-anchor="middle" x="255" y="504">Pusat Pelajar</text>
<text fill="#607994" font-size="7.5" font-weight="500" text-anchor="middle" x="255" y="515">Anjung Siswa &amp; Kafe</text>
</g>
<!-- BUILDING 5: Pusat Komputer & Sains Matematik -->
<g filter="url(#buildingShadow)">
<rect fill="#ecf2f8" height="60" rx="3" stroke="#bacbde" stroke-width="1.5" width="85" x="330" y="320"></rect>
<text fill="#324f6c" font-size="8" font-weight="700" text-anchor="middle" x="372" y="348">Pusat Pengajian</text>
<text fill="#58738f" font-size="7.5" font-weight="600" text-anchor="middle" x="372" y="359">Sains Komputer</text>
</g>
<!-- Interactive Map POI Markers -->
<!-- Refill Water Station Marker at Library -->
<g transform="translate(305, 185)">
<circle cx="0" cy="0" fill="#0284c7" r="10" stroke="#ffffff" stroke-width="2"></circle>
<!-- Droplet Icon -->
<path d="M0,-4 C-2.5,-1 -4,1 -4,3 C-4,5.2 -2.2,7 0,7 C2.2,7 4,5.2 4,3 C4,1 2.5,-1 0,-4 Z" fill="#ffffff"></path>
</g>
<!-- Cafe Marker at Pusat Pelajar -->
<g transform="translate(315, 475)">
<circle cx="0" cy="0" fill="#e27a12" r="10" stroke="#ffffff" stroke-width="2"></circle>
<circle cx="0" cy="0" fill="#ffffff" r="4"></circle>
</g>
<!-- Current User Live GPS Location Indicator -->
<g transform="translate(195, 335)">
<!-- Pulse animation wave ring -->
<circle class="pulse-dot" cx="0" cy="0" fill="#438eb9" r="18"></circle>
<circle cx="0" cy="0" fill="#438eb9" fill-opacity="0.25" r="10"></circle>
<!-- Center Blue Dot -->
<circle cx="0" cy="0" fill="#438eb9" r="7" stroke="#ffffff" stroke-width="2.5"></circle>
<circle cx="0" cy="0" fill="#ffffff" r="2.5"></circle>
<!-- Direction Beam pointer -->
<polygon fill="#438eb9" opacity="0.8" points="0,-14 -4,-7 4,-7"></polygon>
</g>
</svg>
<!-- Compass Rose Indicator (Top Right beneath header) -->
<div class="absolute top-28 right-3.5 z-20 flex flex-col items-center justify-center w-8 h-8 rounded-full bg-white/90 backdrop-blur-sm shadow-md border border-slate-200" data-purpose="compass-indicator">
<svg class="w-5 h-5" fill="none" viewbox="0 0 24 24">
<!-- North Needle (Red) -->
<polygon fill="#e53e3e" points="12,3 15.5,12 12,10"></polygon>
<!-- South Needle (Slate) -->
<polygon fill="#94a3b8" points="12,21 15.5,12 12,10"></polygon>
<!-- West & East points -->
<polygon fill="#c53030" points="12,3 8.5,12 12,10"></polygon>
<polygon fill="#64748b" points="12,21 8.5,12 12,10"></polygon>
</svg>
<span class="text-[7px] font-bold text-slate-700 leading-none -mt-0.5">N</span>
</div>
<!-- BEGIN: FloatingTopControls -->
<!-- Search Input Card & Horizontal Scroll Category Pills -->
<div class="absolute top-3 left-0 right-0 z-20 px-3.5 space-y-2.5" data-purpose="floating-search-section">
<!-- Search Input Bar -->
<div class="flex items-center bg-white rounded-xl shadow-lg border border-slate-200/80 px-3.5 py-2.5 space-x-2.5 transition focus-within:ring-2 focus-within:ring-[#438eb9]/40">
<!-- Search Icon -->
<svg class="w-4 h-4 text-slate-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<input class="w-full text-xs font-medium text-slate-800 placeholder-slate-400 focus:outline-none bg-transparent p-0 border-0 focus:ring-0" placeholder="Search places on campus..." type="text"/>
<!-- Quick Audio / Clear shortcut -->
<button aria-label="Voice search or clear" class="text-slate-400 hover:text-slate-600 focus:outline-none p-0.5" type="button">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 02-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
<!-- Horizontally Scrollable Category Pills -->
<div class="flex items-center space-x-2 overflow-x-auto no-scrollbar py-0.5 pr-2">
<!-- 1. Bus: Disabled + Orange "Soon" Badge pill -->
<div class="relative shrink-0">
<button class="flex items-center space-x-1.5 px-3 py-1.5 rounded-full bg-slate-100/90 text-slate-400 border border-slate-200 text-xs font-medium cursor-not-allowed select-none opacity-80 backdrop-blur-xs" disabled="" type="button">
<svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M8 7h8m-8 4h8m-9 7h10a2 2 0 002-2V6a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zm1-2a1 1 0 110-2 1 1 0 010 2zm8 0a1 1 0 110-2 1 1 0 010 2z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>Bus</span>
<span class="inline-block bg-[#e27a12] text-white text-[9px] font-bold px-1.5 py-0.2 rounded-full uppercase tracking-tight ml-0.5">
                Soon
              </span>
</button>
</div>
<!-- 2. Lecture Halls: Active / Selectable Style -->
<button class="shrink-0 flex items-center space-x-1.5 px-3 py-1.5 rounded-full bg-[#438eb9] text-white shadow-sm border border-[#3b7fa7] text-xs font-medium active:scale-95 transition-transform" type="button">
<svg class="w-3.5 h-3.5 fill-current" viewbox="0 0 24 24">
<path d="M12 3L2 12H5V20H19V12H22L12 3M12 7.7L16 11.3V18H8V11.3L12 7.7M10 13H14V16H10V13Z"></path>
</svg>
<span>Lecture Halls</span>
</button>
<!-- 3. Water Refills -->
<button class="shrink-0 flex items-center space-x-1.5 px-3 py-1.5 rounded-full bg-white text-slate-700 shadow-sm border border-slate-200 text-xs font-medium active:bg-slate-50 transition-colors" type="button">
<svg class="w-3.5 h-3.5 text-sky-500 fill-current" viewbox="0 0 20 20">
<path clip-rule="evenodd" d="M7.707 10.293a1 1 0 010-1.414l3-3a1 1 0 011.414 0l3 3a1 1 0 01-1.414 1.414L11 7.414V17a1 1 0 11-2 0V7.414L6.293 10.293a1 1 0 01-1.414 0z" fill-rule="evenodd"></path>
</svg>
<span>Water</span>
</button>
<!-- 4. Food / Cafeteria -->
<button class="shrink-0 flex items-center space-x-1.5 px-3 py-1.5 rounded-full bg-white text-slate-700 shadow-sm border border-slate-200 text-xs font-medium active:bg-slate-50 transition-colors" type="button">
<svg class="w-3.5 h-3.5 text-amber-600" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M12 6v6m0 0v6m0-6h6m-6 0H6" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M21 15.5V17a2 2 0 01-2 2H5a2 2 0 01-2-2v-1.5a4.5 4.5 0 019 0v.5h2v-.5a4.5 4.5 0 017 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>Food</span>
</button>
<!-- 5. Dorms / Desasiswa -->
<button class="shrink-0 flex items-center space-x-1.5 px-3 py-1.5 rounded-full bg-white text-slate-700 shadow-sm border border-slate-200 text-xs font-medium active:bg-slate-50 transition-colors" type="button">
<svg class="w-3.5 h-3.5 text-indigo-500" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M3 10h18M3 14h18m-9-4v8m-7 0h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>Dorms</span>
</button>
<!-- 6. More Filter -->
<button class="shrink-0 flex items-center space-x-1 px-2.5 py-1.5 rounded-full bg-white text-slate-600 shadow-sm border border-slate-200 text-xs font-medium active:bg-slate-50" type="button">
<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24">
<path d="M5 12h.01M12 12h.01M19 12h.01M6 12a1 1 0 11-2 0 1 1 0 012 0zm7 0a1 1 0 11-2 0 1 1 0 012 0zm7 0a1 1 0 11-2 0 1 1 0 012 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>More</span>
</button>
</div>
</div>
<!-- END: FloatingTopControls -->
<!-- BEGIN: RightMapActions -->
<!-- Floating action controls stacked thumb-height above bottom peek sheet -->
<div class="absolute bottom-24 right-3.5 z-20 flex flex-col items-center space-y-3" data-purpose="map-action-buttons">
<!-- Zoom In / Zoom Out Stacked Pill -->
<div class="flex flex-col bg-white rounded-xl shadow-lg border border-slate-200/90 overflow-hidden divide-y divide-slate-100">
<button aria-label="Zoom in map" class="w-10 h-10 flex items-center justify-center text-slate-700 active:bg-slate-100 focus:outline-none" type="button">
<svg class="w-4 h-4 font-bold stroke-current stroke-2" fill="none" viewbox="0 0 24 24">
<path d="M12 4v16m8-8H4" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<button aria-label="Zoom out map" class="w-10 h-10 flex items-center justify-center text-slate-700 active:bg-slate-100 focus:outline-none" type="button">
<svg class="w-4 h-4 font-bold stroke-current stroke-2" fill="none" viewbox="0 0 24 24">
<path d="M20 12H4" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
<!-- Locate Me FAB (Crosshair / GPS targeting) -->
<button aria-label="Re-center my location" class="w-11 h-11 bg-white rounded-full shadow-lg border border-slate-200/90 flex items-center justify-center text-[#438eb9] hover:bg-slate-50 active:scale-90 transition-transform focus:outline-none" type="button">
<svg class="w-5 h-5 stroke-current stroke-2" fill="none" viewbox="0 0 24 24">
<circle cx="12" cy="12" r="7"></circle>
<path d="M12 2v3m0 14v3M2 12h3m14 0h3" stroke-linecap="round" stroke-linejoin="round"></path>
<circle cx="12" cy="12" fill="currentColor" r="2"></circle>
</svg>
</button>
</div>
<!-- END: RightMapActions -->
<!-- BEGIN: BottomSheetPeek -->
<!-- Collapsed Peek Bottom Sheet pinned to screen bottom -->
<section class="absolute bottom-0 left-0 right-0 z-30 bg-white rounded-t-2xl shadow-[0_-6px_20px_rgba(0,0,0,0.12)] border-t border-slate-200/80 px-4 pt-2 pb-5 select-none transition-all" data-purpose="bottom-sheet-peek">
<!-- Centered Pull / Drag Handle Pill -->
<div class="w-full flex justify-center py-1 cursor-grab active:cursor-grabbing">
<div class="w-10 h-1 bg-slate-300 rounded-full"></div>
</div>
<!-- Sheet Header Content (Peek State) -->
<div class="flex items-center justify-between pt-1 pb-1">
<div>
<h2 class="font-semibold text-slate-800 text-base leading-tight">Nearby</h2>
<p class="text-xs text-slate-500 font-normal mt-0.5">Tap a category to see places</p>
</div>
<!-- Chevron Up Indicator (affordance for dragging up) -->
<div class="w-8 h-8 rounded-full bg-slate-50 flex items-center justify-center text-slate-400">
<svg class="w-5 h-5 stroke-current stroke-2" fill="none" viewbox="0 0 24 24">
<path d="M5 15l7-7 7 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
</div>
</section>
<!-- END: BottomSheetPeek -->
</main>
<!-- END: MapViewport -->
</div>
<!-- END: MobileDeviceContainer -->
</body></html>
